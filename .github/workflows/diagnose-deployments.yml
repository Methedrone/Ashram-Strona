name: List CF Pages deployments (one-time diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [dev, master]
    paths:
      - '.github/workflows/diagnose-deployments.yml'

jobs:
  list-deployments:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: List all deployments in CF Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          echo "=== Production deployments ==="
          npx wrangler pages deployment list \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --environment=production \
            --json 2>&1 | head -100

          echo ""
          echo "=== Preview deployments (last 20) ==="
          npx wrangler pages deployment list \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --environment=preview \
            --json 2>&1 | head -200

      - name: Upload deployment list as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-deployments
          path: |
            production-deployments.json
            preview-deployments.json
          if-no-files-found: warn
          retention-days: 7
