name: Force-delete old CF Pages deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Deployment ID to delete (leave empty to list deployments first)'
        required: false
        type: string
        default: ''
      force:
        description: 'Force delete aliased deployment (USE WITH CARE)'
        required: false
        type: boolean
        default: false
  push:
    branches: [dev, master]
    paths:
      - '.github/workflows/force-delete-deployment.yml'

jobs:
  force-delete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (with new wrangler 4.103.0)
        run: |
          npm install --no-save wrangler@4.103.0 2>&1 | tail -5
          npx wrangler --version

      - name: List all production deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          echo "=== All production deployments (via wrangler) ==="
          npx wrangler pages deployment list \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --environment=production \
            --json 2>&1 | head -200 > /tmp/prod_deploys.json
          cat /tmp/prod_deploys.json

      - name: List all preview deployments (top 50)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          echo "=== Preview deployments (top 10) ==="
          npx wrangler pages deployment list \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --environment=preview \
            --json 2>&1 | head -100

      - name: List all deployments via direct CF API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          echo "=== Direct API: GET /deployments ==="
          curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -w "\nHTTP_STATUS: %{http_code}\n" 2>&1 | head -500

      - name: Try wrangler pages deployment delete (only if deployment_id given)
        if: env.DEPLOYMENT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          echo "=== wrangler pages deployment --help (4.103.0) ==="
          npx wrangler pages deployment --help 2>&1 | head -30

          echo ""
          echo "=== Try wrangler pages deployment delete ==="
          npx wrangler pages deployment delete \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --deployment-id="$DEPLOYMENT_ID" 2>&1 | head -20 || echo "wrangler delete failed, will try direct API"

      - name: Try direct CF API DELETE (with force option)
        if: env.DEPLOYMENT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          FORCE: ${{ inputs.force }}
        run: |
          FORCE_PARAM=""
          if [ "$FORCE" = "true" ]; then
            FORCE_PARAM="?force=true"
            echo "⚠️  USING FORCE DELETE ⚠️"
          fi

          echo "=== Direct CF API: DELETE deployment $DEPLOYMENT_ID $FORCE_PARAM ==="
          curl -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME/deployments/$DEPLOYMENT_ID$FORCE_PARAM" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS: %{http_code}\n" 2>&1 | head -30

      - name: List all deployments (final state)
        if: env.DEPLOYMENT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          echo "=== Deployments after delete attempt ==="
          npx wrangler pages deployment list \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --environment=production \
            --json 2>&1 | head -30
