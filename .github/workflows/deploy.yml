name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || vars.INDEXNOW_KEY }}
        run: npm run build:cf

      # Use wrangler pages deploy directly instead of cloudflare/pages-action.
      # pages-action with `directory: dist` only uploads dist/ contents as
      # static assets — it does NOT register dist/functions/*.ts as Pages
      # Functions. wrangler pages deploy does both: uploads the build output
      # directory as static AND compiles + uploads <dir>/functions/ as Functions.
      # Adapter v14 layout: static assets now live in dist/client/.
      # Deploy to production. The previous version passed --branch=master,
      # which in wrangler 4.x targets the preview alias (master.pages.dev)
      # instead of the custom-domain production build. Without --branch,
      # wrangler uploads to the project's production branch and updates
      # the custom domain in one step.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: npx wrangler pages deploy dist/client --project-name="$CLOUDFLARE_PROJECT_NAME" --commit-dirty=true
